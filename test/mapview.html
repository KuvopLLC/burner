<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh}canvas{image-rendering:pixelated;width:1280px;height:704px}</style></head>
<body><canvas id="m" width="320" height="176"></canvas>
<script type="module">
import { buildBronxMap } from '../src/bronx.js';
import { SPOTS } from '../src/data.js';
const ctx = document.getElementById('m').getContext('2d');
ctx.imageSmoothingEnabled = false;
ctx.drawImage(buildBronxMap(), 0, 0);
// show every spot dot for placement review
ctx.fillStyle = '#fff';
for (const s of SPOTS) {
  ctx.fillStyle = s.kind === 'train' ? '#ff4070' : s.kind === 'gallery' ? '#c8c8d8' : '#ffd94a';
  ctx.fillRect(s.x - 1, s.y - 1, 3, 3);
}
</script></body></html>
