<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#0a0a0f;display:flex;align-items:center;justify-content:center}canvas{image-rendering:pixelated}
#fshint{display:none;position:fixed;z-index:12;left:50%;transform:translateX(-50%);top:8px;padding:10px 16px;background:rgba(12,12,24,.92);color:#ffe040;border:1px solid #3a3a52;font:bold 13px monospace}
</style></head>
<body><canvas id="screen" width="384" height="216"></canvas>
<div id="fshint">THIS BROWSER CAN'T GO FULLSCREEN<br>ON IPHONE, CHROME CAN &middot; TAP TO DISMISS</div>
<script type="module">
import '../src/main.js';
setTimeout(() => {
  const cv = document.getElementById('screen');
  const r = cv.getBoundingClientRect();
  const opts = { clientX: r.left + 50, clientY: r.top + 50, bubbles: true, pointerId: 1 };
  cv.dispatchEvent(new PointerEvent('pointerdown', opts));
  cv.dispatchEvent(new PointerEvent('pointerup', opts));
  setTimeout(() => {
    console.log('HINT VISIBLE:', document.getElementById('fshint').style.display === 'block',
      '| STORED:', localStorage.getItem('burner.fshint'));
  }, 300);
}, 500);
</script></body></html>
