<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BURNER — headless drive test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0f;
    display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<script type="module">
import '../src/main.js';

// Adaptive driver: reads window.BURNER and plays one full loop —
// name, tumbler, sketch, map, paint (properly: right can per
// region, hides from cops), result, book, rack run. Headless rAF stalls
// under --virtual-time-budget, so it pumps G.step() itself. Scene
// transitions are console.logged so you know where a budget lands.

const cv = document.getElementById('screen');
const PXo = 40, PYo = 34; // piece offset in the paint scene (paint.js)

function key(k, type = 'both') {
  if (type !== 'up') window.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
  if (type !== 'down') window.dispatchEvent(new KeyboardEvent('keyup', { key: k }));
}
function mouse(type, gx, gy) {
  const b = cv.getBoundingClientRect();
  const s = b.width / 320;
  cv.dispatchEvent(new MouseEvent(type, {
    clientX: b.left + gx * s, clientY: b.top + gy * s, bubbles: true,
  }));
}

let lastScene = '', sceneAt = 0, now = 0;
let typed = false, hiding = false, rackDone = false, done = false;
let plan = null, copSeen = false;

setInterval(() => {
  const G = window.BURNER;
  if (!G || done) return;
  now += 100;
  G.step(0.1); // headless rAF stalls under virtual time; pump manually
  if (G.sceneName !== lastScene) {
    lastScene = G.sceneName;
    sceneAt = now;
    console.log(`SCENE ${lastScene} @ ${now}`);
  }
  const el = now - sceneAt;
  const sc = G.scene;

  switch (G.sceneName) {
    case 'title':
      if (el >= 300) key('Enter');
      break;
    case 'name':
      if (!typed) { typed = true; for (const c of 'ZEKE') key(c); }
      if (el >= 400) key('Enter');
      break;
    case 'partner':
      if (el > 4000 || (sc.locked && sc.lockT > 0.7)) key('Enter');
      break;
    case 'sketch':
      if (sc.t > 1.1) key('Enter');
      break;
    case 'map': {
      // #wall / #gallery hash aims at that kind; default: a yard
      const wantKind = location.hash === '#wall' ? 'wall'
        : location.hash === '#gallery' ? 'gallery' : 'train';
      if (el >= 300) {
        if (sc.spots[sc.sel].kind !== wantKind) key('ArrowRight');
        else key('Enter');
      }
      break;
    }
    case 'paint':
      paintTick(G, sc.s);
      break;
    case 'result':
      if (sc.s.t > 1.1) {
        console.log(`RESULT burners up=${G.run.pieces.length}`);
        key('Enter');
      }
      break;
    case 'book':
      if (el >= 600) key('Enter');
      break;
    case 'intermission':
      if (G.run.pieces.length >= 2) {
        done = true;
        console.log(`DRIVE DONE @ ${now} — burners=${G.run.pieces.length} strikes=${G.run.strikes}`);
      } else if (el >= 400) {
        plan = null; copSeen = false; // fresh night
        key('Enter');
      }
      break;
    case 'gameover':
      done = true;
      console.log('DRIVE DONE (GAMEOVER) @ ' + now);
      break;
  }
}, 100);

// Paint like a writer: one region at a time, bursting straight at
// uncovered pixels, hiding whenever trouble (cop OR dog) is out.
function paintTick(G, s) {
  if (!s || s.busted || s.done) return;
  const piece = G.run.piece, w = piece.w;

  const trouble = (s.cop && !s.cop.leaving) || s.dog;
  if (trouble) {
    if (!hiding) {
      hiding = true;
      if (!copSeen) { copSeen = true; console.log(`TROUBLE (${s.dog ? 'dog' : 'cop'}) @ ${now}`); }
      key(' ', 'down');
    }
    return;
  }
  if (hiding) { hiding = false; key(' ', 'up'); }

  if (!plan) { plan = { cursor: 0, reg: null }; console.log(`PAINT START (r=${s.burstR})`); }
  const regs = [5, 4, 1, 2, 3].filter(r => !s.regDone[r]);
  if (!regs.length) return; // waiting for the auto-finish
  const reg = regs[0];
  if (plan.reg !== reg) { plan.reg = reg; plan.cursor = 0; }
  const want = piece.palette[reg].id;
  const canIdx = s.bag.findIndex(c => c.id === want);
  if (canIdx >= 0 && s.selected !== canIdx) { key(String(canIdx + 1)); return; }

  const total = piece.w * piece.h;
  for (let n = 0; n < 6 && !s.regDone[reg]; n++) {
    let found = -1, i = plan.cursor;
    for (let scanned = 0; scanned < total; scanned++, i = (i + 7) % total) {
      if (piece.regions[i] === reg && !s.covered[i]) { found = i; break; }
    }
    if (found < 0) break;
    plan.cursor = (found + 7) % total;
    mouse('mousemove', PXo + (found % w), PYo + ((found / w) | 0));
    G.step(0.01);
    key('x');
    G.step(0.02);
    if (s.cop || s.dog) break;
  }
}
</script>
</body>
</html>
