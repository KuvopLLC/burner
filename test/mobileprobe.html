<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0a0a0f;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="screen" width="384" height="216"></canvas>
<script type="module">
import '../src/main.js';
// drive to a scene by ?scene=name; simulate taps by ?tapname
const G0 = () => window.BURNER;
let n = 0;
setInterval(() => {
  const G = G0(); if (!G) return;
  n += 100; G.step(0.1);
  const want = new URLSearchParams(location.search).get('scene');
  if (want === 'name' && G.sceneName === 'title' && n >= 400) G.go('name');
  if (want === 'paint' && n === 400) {
    // fabricate a run and jump straight to the wall
    import('../src/world.js').then(async w => {
      const d = await import('../src/data.js');
      const g = await import('../src/gen.js');
      G.run = w.newRun('ZEKE', 77);
      G.run.partner = d.PARTNERS[4];
      G.run.piece = g.makePiece('ZEKE', 4242, 'KWIK 12');
      const spotId = new URLSearchParams(location.search).get('spot');
      G.run.spot = d.SPOTS.find(sp => sp.id === spotId) || d.SPOTS[0];
      G.go('paint');
    });
  }
}, 100);
</script></body></html>
