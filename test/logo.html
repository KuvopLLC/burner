<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#0c0c1e}canvas{image-rendering:pixelated}</style></head>
<body><canvas id="l" width="720" height="270"></canvas>
<script type="module">
import { makePiece, renderPiece } from '../src/gen.js';
const ctx = document.getElementById('l').getContext('2d');
ctx.imageSmoothingEnabled = false;
ctx.fillStyle = '#0c0c1e';
ctx.fillRect(0, 0, 720, 270);
const piece = renderPiece(makePiece('BURNER', 909, null, 'BURNER'));
ctx.drawImage(piece, 0, 0, 240, 90, 0, 0, 720, 270);
</script></body></html>
