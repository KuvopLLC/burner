<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BURNER</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BURNER">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0f;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed; inset: 0;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #rotate {
    display: none;
    position: fixed; inset: 0; z-index: 10;
    background: #0c0c1e; color: #ffe040;
    font: bold 18px monospace; letter-spacing: 2px;
    align-items: center; justify-content: center;
    text-align: center; line-height: 2;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }
  body { padding-bottom: env(safe-area-inset-bottom); }
  #unfull {
    display: none;
    position: fixed; z-index: 11;
    top: calc(4px + env(safe-area-inset-top));
    right: calc(4px + env(safe-area-inset-right));
    width: 34px; height: 34px; line-height: 34px;
    text-align: center; border-radius: 6px;
    background: rgba(12,12,24,.55); color: #9a9aa8;
    font: bold 20px monospace;
  }
  :fullscreen #unfull { display: block; }
  #fshint {
    display: none;
    position: fixed; z-index: 12;
    left: 50%; transform: translateX(-50%);
    top: calc(8px + env(safe-area-inset-top));
    padding: 10px 16px; border-radius: 6px;
    background: rgba(12,12,24,.92); color: #ffe040;
    border: 1px solid #3a3a52;
    font: bold 13px monospace; letter-spacing: 1px;
    text-align: center; max-width: 86vw;
  }
</style>
</head>
<body>
<canvas id="screen" width="384" height="216"></canvas>
<div id="rotate">ROTATE YOUR PHONE<br>&#8634;<br>THE BRONX IS WIDE</div>
<div id="unfull" onpointerdown="event.stopPropagation();document.exitFullscreen&&document.exitFullscreen()">&#10005;</div>
<div id="fshint" onpointerdown="event.stopPropagation();this.style.display='none'">FOR TRUE FULLSCREEN: SHARE &rarr; ADD TO HOME SCREEN<br>THEN PLAY FROM THE ICON &middot; TAP TO DISMISS</div>
<div id="ts-slot" style="position:absolute;left:-9999px;top:0"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
